<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Inter Tight";font-weight:700;src:url(../../site/fonts/inter-tight-700.woff2) format("woff2")}
html,body{margin:0;background:#1C1E22}
.stage{width:1024px;height:526px;display:flex;align-items:center;justify-content:center;gap:28px}
svg{width:132px;height:132px;display:block;overflow:hidden}
path{fill:none;stroke:#F2B33D;stroke-width:10;stroke-linecap:butt}
.name{font:700 104px/1 "Inter Tight",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#EEE8DC}
</style></head><body><div class="stage">
<svg viewBox="0 0 72 72"><path id="a" d="M -10 12 H 14 A 46 46 0 0 1 60 58 V 82"/><path id="b" d="M -10 28 H 14 A 30 30 0 0 1 44 58 V 82"/><path id="c" d="M -10 44 H 14 A 14 14 0 0 1 28 58 V 82"/></svg>
<span class="name">Relay</span></div>
<script>
const P=[...document.querySelectorAll('path')].reverse();  /* innermost line first, like a signal going out */
P.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.dataset.L=L});
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
/* t in seconds over a 3.2 s loop: each line draws in 0.5 s, staggered 0.25 s; hold; then all fade out together */
window.frame=t=>{P.forEach((p,i)=>{const L=+p.dataset.L;const k=Math.min(1,Math.max(0,(t-0.2-i*0.25)/0.5));
 p.style.strokeDashoffset=L*(1-ease(k));
 const f=Math.min(1,Math.max(0,(t-2.6)/0.4));p.style.opacity=1-ease(f);});};
frame(0);
</script></body></html>
