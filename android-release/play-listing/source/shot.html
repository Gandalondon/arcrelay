<!doctype html>
<!-- Relay Play listing art (5 Nov 2026). Rendered by render.js: four 1080 x 1920 screenshots (#s1 to #s4) and the 1024 x 500 feature graphic (#fg).
     Same language as getarcrelay.app/beta: charcoal ground, cream Inter Tight, the real app screens in a phone frame, no gradients.
     The screens are the site's captures (screens/*.webp); re-capture on the Pixel when the app UI changes, then re-run render.js. -->
<meta charset="utf-8">
<style>
@font-face{font-family:IT;font-weight:400;src:url(inter-tight-400.woff2)}
@font-face{font-family:IT;font-weight:600;src:url(inter-tight-600.woff2)}
@font-face{font-family:IT;font-weight:700;src:url(inter-tight-700.woff2)}
html,body{margin:0;background:#1C1E22;color:#EEE8DC;font-family:IT}
.s{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1C1E22;margin-bottom:40px}
.s h1{position:absolute;left:96px;right:96px;top:136px;margin:0;font:600 104px/1 IT;letter-spacing:0;white-space:pre-line}  /* every title on two lines, so the phones line up */
/* phone: frame, corners and screen radius in proportion to its width, as on the site */
.ph{--pw:640px;position:absolute;left:50%;top:440px;width:var(--pw);aspect-ratio:390/844;transform:translateX(-50%);box-sizing:border-box;padding:calc(var(--pw) * .0333);border-radius:calc(var(--pw) * .1467);background:#2A2C32;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.ph img{display:block;width:100%;height:100%;border-radius:calc(var(--pw) * .1133);object-fit:cover;object-position:top}
/* feature graphic: the site's closing lockup, phone turned the way it is in the finale */
.fg{position:relative;width:1024px;height:500px;overflow:hidden;background:#1C1E22;display:flex;align-items:center}
.fg h2{margin:0 0 0 80px;font:700 96px/1.02 IT;letter-spacing:-.01em;white-space:pre-line}
.fg .stage{position:absolute;left:700px;top:50%;perspective:1400px;transform:translate(-50%,-50%)}
.p3{--pw:196px;--d:23px;position:relative;width:var(--pw);aspect-ratio:390/844;border-radius:calc(var(--pw) * .1467);transform-style:preserve-3d;transform:rotateX(22deg) rotateY(34deg) rotateZ(-10deg)}
.p3 i{position:absolute;inset:0;border-radius:inherit;background:#222429;transform:translateZ(calc(var(--k) * var(--d) / -12))}
.p3 i.rim{background:#34363C}
.p3 .scr{position:absolute;inset:calc(var(--pw) * .0333);border-radius:calc(var(--pw) * .1133);overflow:hidden;transform:translateZ(.5px)}
.p3 .scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
</style>
<div class="s" id="s1"><h1>Need a
quick evac?</h1><div class="ph"><img src="cap-exit.webp" alt=""></div></div>
<div class="s" id="s2"><h1>Say “Hey Relay”,
hear the answer.</h1><div class="ph"><img src="cap-listening.webp" alt=""></div></div>
<div class="s" id="s3"><h1>Find what
you need.</h1><div class="ph"><img src="cap-find.webp" alt=""></div></div>
<div class="s" id="s4"><h1>Get help
on quests.</h1><div class="ph"><img src="cap-quest.webp" alt=""></div></div>
<div class="fg" id="fg"><h2>Ask. Find.
Get out.</h2><div class="stage"><div class="p3"><i style="--k:12"></i><i style="--k:11"></i><i style="--k:10"></i><i style="--k:9"></i><i style="--k:8"></i><i style="--k:7"></i><i style="--k:6"></i><i style="--k:5"></i><i style="--k:4"></i><i style="--k:3"></i><i style="--k:2"></i><i class="rim" style="--k:1"></i><div class="scr"><img src="cap-exit.webp" alt=""></div></div></div></div>
